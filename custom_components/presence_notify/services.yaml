send:
  fields:
    title:
      required: true
      example: "Washing machine"
      selector:
        text:
    message:
      required: true
      example: "The laundry is done."
      selector:
        text:
          multiline: true
    data:
      required: false
      example: '{"image": "/api/camera_proxy/camera.front_door"}'
      selector:
        object:
    speakers:
      required: false
      selector:
        entity:
          domain: media_player
          multiple: true
    ignore_quiet_hours:
      required: false
      default: false
      selector:
        boolean:
    actions:
      required: false
      selector:
        object:
          multiple: true
          label_field: title
          fields:
            title:
              label: Title
              required: true
              selector:
                text:
            action:
              label: ID
              selector:
                text:
            uri:
              label: Link
              selector:
                text:
                  type: url

deliver_pending:
  fields:
    speakers:
      required: false
      selector:
        entity:
          domain: media_player
          multiple: true

clear_pending:

ask:
  fields:
    title:
      required: true
      example: "Dryer"
      selector:
        text:
    question:
      required: true
      example: "The dryer is ready. Start now?"
      selector:
        text:
          multiline: true
    timeout:
      required: false
      default: 15
      selector:
        number:
          min: 1
          max: 240
          unit_of_measurement: min
          mode: box
    text_yes:
      required: false
      selector:
        text:
    text_no:
      required: false
      selector:
        text:
    speakers:
      required: false
      selector:
        entity:
          domain: media_player
          multiple: true
